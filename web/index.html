<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>rain-or-gains</title>
    <meta name="description" content="How full is the gym, and does the weather change it? Live FitX occupancy with weather and holidays." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5c-3.6 4.7-6.2 8.2-6.2 11.4a6.2 6.2 0 0 0 12.4 0c0-3.2-2.6-6.7-6.2-11.4z' fill='%232a78d6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1>
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5c-3.6 4.7-6.2 8.2-6.2 11.4a6.2 6.2 0 0 0 12.4 0c0-3.2-2.6-6.7-6.2-11.4z" />
          <path class="logo-bar" d="M8.6 15.2h6.8" />
        </svg>
        rain-or-gains
      </h1>
      <label class="studio-picker" hidden>
        <span>Studio</span>
        <select id="studio"></select>
      </label>
      <p id="studio-name" class="studio-name"></p>
      <div id="now-status" class="header-status" hidden></div>
    </header>
    <a id="sticky-now" class="sticky-now" href="#view-now" hidden aria-hidden="true" tabindex="-1"></a>
    <section id="progress" class="progress" aria-label="Data collected so far" hidden></section>
    <main id="views">
      <section id="view-now" class="view"><h2>Now <span id="now-updated" class="heading-meta"></span></h2><div class="view-body"></div></section>
      <section id="view-week" class="view"><h2>Week and weather</h2><div class="view-body"></div></section>
      <section id="view-heatmap" class="view"><h2>Typical week</h2><div class="view-body"></div></section>
      <section id="view-effect" class="view"><h2>Weather effect</h2><div class="view-body"></div></section>
    </main>
    <footer class="site-footer">
      Occupancy from FitX, sampled every 5 minutes. Weather by
      <a href="https://open-meteo.com/">Open-Meteo</a>, holidays by <a href="https://www.openholidaysapi.org/">OpenHolidays</a>.
    </footer>
  </body>
</html>
