<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Rain or Gains</title>
    <meta name="description" content="How full is the gym, and does the weather change it? Live FitX occupancy with weather and holidays." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='2 -2 62 62'%3E%3Cstyle%3E@media (prefers-color-scheme: dark){.f{stroke:%23eee}}%3C/style%3E%3Cg transform='translate(0 9)'%3E%3Cg class='f' fill='none' stroke='%23111' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg transform='rotate(84 24 20)'%3E%3Crect x='4.2' y='7.6' width='3.6' height='8.8' rx='1.6' /%3E%3Crect x='7.8' y='3.6' width='5.5' height='16.8' rx='2.6' /%3E%3Cpath d='M13.3 10.3H15M13.3 13.7H15' /%3E%3Crect x='40.2' y='7.6' width='3.6' height='8.8' rx='1.6' /%3E%3Crect x='34.7' y='3.6' width='5.5' height='16.8' rx='2.6' /%3E%3Cpath d='M32.2 10.3H34.7M32.9 13.7H34.7' /%3E%3Cpath d='M17 24C14.8 21.8 14.4 19 15 16V10a2 2 0 0 1 4 0a2 2 0 0 1 4 0a2 2 0 0 1 4 0a2 2 0 0 1 4 0c2.4 2.6 2.6 8-1.5 13' /%3E%3Cpath d='M19 10v4.5M23 10v4.5M27 10v4M15.3 16.5H27c1.8 0 3-1.4 3-3.2' /%3E%3Cpath d='M17 24l-3.9 13.5M29.5 23l-3.9 13.5' /%3E%3C/g%3E%3C/g%3E%3Cg fill='%232a78d6'%3E%3Cpath d='M51 6.5c-3.2 4.4-5.6 7.6-5.6 10.6a5.6 5.6 0 0 0 11.2 0c0-3-2.4-6.2-5.6-10.6z' transform='rotate(24 51 17)'/%3E%3Ccircle cx='59.5' cy='9' r='1.5'/%3E%3Ccircle cx='58.5' cy='27' r='1.6'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
    <script>
      try {
        const t = localStorage.getItem("theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="wordmark"><span class="wordmark-rain">Rain</span> <span class="wordmark-or">or</span> Gains</h1>
      <label class="studio-picker" hidden>
        <span>Studio</span>
        <select id="studio"></select>
      </label>
      <p id="studio-name" class="studio-name"></p>
      <button id="theme-toggle" class="theme-toggle" type="button" data-choice="auto" aria-label="Theme: auto" title="Theme: auto">
        <svg class="icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none" /></svg>
        <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
      </button>
      <div id="now-status" class="header-status" hidden></div>
    </header>
    <a id="sticky-now" class="sticky-now" href="#view-now" hidden aria-hidden="true" tabindex="-1"></a>
    <section id="progress" class="progress" aria-label="Data collected so far" hidden></section>
    <main id="views">
      <section id="view-now" class="view"><h2>Now <span id="now-updated" class="heading-meta"></span></h2><div class="view-body"></div></section>
      <section id="view-week" class="view"><h2>Week and weather</h2><div class="view-body"></div></section>
      <section id="view-heatmap" class="view"><h2>Typical week</h2><div class="view-body"></div></section>
      <section id="view-effect" class="view"><h2>Weather effect</h2><div class="view-body"></div></section>
    </main>
    <footer class="site-footer">
      Occupancy from FitX, sampled every 5 minutes. Weather by
      <a href="https://open-meteo.com/">Open-Meteo</a>, holidays by <a href="https://www.openholidaysapi.org/">OpenHolidays</a>.
    </footer>
  </body>
</html>
